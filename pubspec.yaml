name: cofe_reward
description: A Flutter application for coffee reward system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_widget_from_html: ^0.15.2
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  csc_picker: ^0.2.7
  geolocator: ^13.0.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

